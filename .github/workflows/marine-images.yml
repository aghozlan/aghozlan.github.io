name: Fetch marine deck images
on:
  push:
    paths:
      - 'pyp/marine-ecosystem/img/titles.json'
      - 'pyp/marine-ecosystem/tools/fetch_images.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python pyp/marine-ecosystem/tools/fetch_images.py
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add pyp/marine-ecosystem/img
          git diff --cached --quiet || (git commit -m "Marine deck: cache Wikimedia images locally" && git push)
